# Base44 sandbox environment for a purely static site (single index.html, no build step).
# The page is bind-mounted from the clone, so edits are visible on the next page load.
services:
  web:
    image: nginx:alpine
    labels:
      base44.project: Vitrine Natura
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: on-failure
